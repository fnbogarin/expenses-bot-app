services:
  app:
    build: ./backend-node-expenses
    container_name: expense-bot-app
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: "3000"
      MONGO_URI: mongodb://mongo:27017/expense-bot
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    restart: unless-stopped

  web:
    build:
      context: ./web-react-expenses
      args:
        VITE_API_BASE_URL: http://localhost:3000/v1
    container_name: expense-bot-web
    ports:
      - "8080:80"
    depends_on:
      - app
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: expense-bot-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
